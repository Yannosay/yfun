:root{--bg:#1b1630;--shell:#2a2245;--rim:#433870;--a:#d6405e;--b:#6b5ad0;--ink:#f4ecd8;--muted:#a89cc8;color-scheme:dark}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);overflow:hidden;overscroll-behavior:none;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;font-family:"Press Start 2P",ui-monospace,Menlo,monospace}
#app{position:fixed;inset:0}
#screen{position:absolute;image-rendering:pixelated;image-rendering:crisp-edges;background:#000;border-radius:6px;box-shadow:0 0 0 4px var(--rim),0 0 0 10px var(--shell),0 12px 40px rgba(0,0,0,.6)}
#pad{position:absolute;touch-action:none}
#pad .bar{position:absolute;background:#3b3260;border-radius:10px;box-shadow:inset 0 -4px 0 rgba(0,0,0,.35),0 4px 0 #140f26}
#pad .h{left:0;right:0;top:33%;height:34%}
#pad .v{top:0;bottom:0;left:33%;width:34%}
#pad .hub{position:absolute;left:41%;top:41%;width:18%;height:18%;border-radius:50%;background:#2c2449}
#pad .arr{position:absolute;width:0;height:0;border:9px solid transparent;opacity:.55}
#pad .arr.up{left:50%;top:9%;transform:translateX(-50%);border-bottom-color:var(--ink);border-top-width:0}
#pad .arr.down{left:50%;bottom:9%;transform:translateX(-50%);border-top-color:var(--ink);border-bottom-width:0}
#pad .arr.left{top:50%;left:9%;transform:translateY(-50%);border-right-color:var(--ink);border-left-width:0}
#pad .arr.right{top:50%;right:9%;transform:translateY(-50%);border-left-color:var(--ink);border-right-width:0}
#pad .arr.on{opacity:1;border-bottom-color:#ffd75e}
#pad .arr.down.on{border-top-color:#ffd75e;border-bottom-color:transparent}
#pad .arr.left.on{border-right-color:#ffd75e;border-bottom-color:transparent}
#pad .arr.right.on{border-left-color:#ffd75e;border-bottom-color:transparent}
.btn{position:absolute;border:0;border-radius:50%;color:#fff;font:inherit;font-size:18px;touch-action:none;padding:0;box-shadow:inset 0 -5px 0 rgba(0,0,0,.3),0 5px 0 #140f26}
.btn.on{transform:translateY(3px);box-shadow:inset 0 -2px 0 rgba(0,0,0,.3),0 2px 0 #140f26}
#bA{background:var(--a)}
#bB{background:var(--b)}
#bStart{border-radius:14px;background:#3b3260;font-size:9px;color:var(--muted);letter-spacing:1px}
.lbl{position:absolute;font-size:8px;color:var(--muted);pointer-events:none;text-align:center;letter-spacing:1px}
#probe{position:absolute;visibility:hidden;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
</style>
</head>

function buildCreature(id){
 const d=SP[id],S=24,grid=[];
 const rows=d.rows.map(r=>{r=(r+'............').slice(0,12);return r+[...r].reverse().join('');});
 while(rows.length<S)rows.unshift('.'.repeat(S));
 for(const r of rows)grid.push([...r]);
 const pal=Object.assign({w:'#ffffff',e:'#1c1830',p:'#f4a0b0'},d.pal);
 const on=(i,j)=>j>=0&&j<S&&i>=0&&i<S&&grid[j][i]!=='.';
 const mkc=()=>{const c=mk(26,26);return[c,c.getContext('2d')];};
 const [c,x]=mkc(),[w,wx]=mkc(),[s,sx]=mkc();
 const OUT='#1c1830';
 for(let j=-1;j<=S;j++)for(let i=-1;i<=S;i++){
  if(on(i,j)){
   const ch=grid[j][i];let col=pal[ch]||'#ff00ff';
   if(ch!=='w'&&ch!=='e'){if(!on(i,j+1)||!on(i,j+2))col=shade(col,-.22);else if(!on(i,j-1)||!on(i-1,j))col=shade(col,.2);}
   x.fillStyle=col;x.fillRect(i+1,j+1,1,1);

function aiMove(s,foe){

 let best=null,bs=-1;
 for(const x of opts){const d=mv(x.id);let sc;
  if(d.pow){sc=d.pow*effOf(d.type,SP[foe.mon.id].t)*(SP[s.mon.id].t.includes(d.type)?1.5:1)*d.acc/100;}
  else if(d.fx.st)sc=foe.mon.status?0:45;
  else if(d.fx.heal)sc=s.mon.hp<s.mon.maxhp*.4?90:0;
  else if(d.fx.self)sc=s.st[d.fx.stat]<2?30:0;
  else sc=foe.st[d.fx.stat]>-2?25:0;
  sc*=.75+Math.random()*.5;if(sc>bs){bs=sc;best=x;}}

}

 }
}
function drawTitle(){
 const f2=(fc>>5)%2;
 for(let y=0;y<11;y++)for(let x=-1;x<16;x++){const t=y>6?',':(x+y)%7===0?'f':'.';ctx.drawImage(getTile(t,'route',f2),x*16+((fc>>1)%16),y*16-8);}
 fr(0,0,W,H,'rgba(27,22,48,.45)');
 const ly=22+Math.round(Math.sin(fc/30)*2);
 txt('GLIMMLINGE',W/2-80+2,ly+2,'#2b2440',16);txt('GLIMMLINGE',W/2-80,ly,'#f8d038',16);
 txt('Abenteuer im Moostal',W/2-80,ly+22,'#fbf7ec');
 const ids=['sproessling','flammkit','blubbo'];
 ids.forEach((id,i)=>{const b=Math.round(Math.abs(Math.sin(fc/14+i*1.3))*-5);drawCreature(id,42+i*54,66+b);});
 if(!UI.menus.length&&(fc>>5)%2===0)txt('Drücke A',W/2-32,128,'#fbf7ec');
 txt('v1.0',4,150,'#a89cc8');
}
function render(){
 ctx.save();
 if(mode==='title')drawTitle();
 else if(mode==='battle'&&B)drawBattle();
 else if(mode==='evo'){fr(0,0,W,H,'#1b1630');const E=window.__evo;if(E){const id=E.showB?E.b:E.a;drawCreature(id,94,30,{white:E.white});}}
 else drawWorld();
 ctx.restore();
 if(UI.text)drawText(UI.text);
 for(const m of UI.menus)drawMenu(m);
 if(UI.toast&&mode==='world'){const t=UI.toast;t.t--;if(t.t<=0)UI.toast=null;else{const w=t.text.length*8+20,y=t.t>110?-24+(120-t.t)*3:t.t<10?-24+t.t*3:6;box(6,y,w,22);txt(t.text,16,y+7);}}
 if(UI.wipe){const h=Math.floor(UI.wipe*H/2/8);for(let i=0;i<8;i++){fr(0,i*20,W,h,'#000');fr(0,i*20+20-h,W,h,'#000');}}
 if(UI.fade>0){ctx.globalAlpha=UI.fade;fr(0,0,W,H,'#000');ctx.globalAlpha=1;}
 if(UI.flash>0){ctx.globalAlpha=(UI.flash%6)/6;fr(0,0,W,H,'#fff');ctx.globalAlpha=1;UI.flash--;}
}

async function titleFlow(){
 mode='title';G=newGame();music('title');
 await until(()=>J.a||J.start);sfx('select');
 const sv=loadSave();
 let fresh=true;
 if(sv){const i=await menu({items:['Weiter','Neues Spiel'],x:72,y:104,w:96,cancel:false});
  if(i===0)fresh=false;
  else{await say('Ein neues Spiel überschreibt deinen alten Spielstand.',{wait:false});const ok=await menu({items:['Neu starten','Abbrechen'],x:120,y:64,w:116,cancel:false});UI.text=null;if(ok!==0)fresh=false;}}
 await fadeOut(16);
 if(fresh)G=newGame();else G=sv;
 if(master)master.gain.value=G.muted?0:.16;
 loadMap(G.map);P.x=G.x;P.y=G.y;P.dir=G.dir||'down';P.moving=false;
 mode='world';music(M.music);showMapName();
 await fadeIn(16);
 if(fresh)await starterFlow();
}

function layout(){
 const vw=innerWidth,vh=innerHeight,pr=getComputedStyle(document.getElementById('probe'));
 const si={t:parseFloat(pr.paddingTop)||0,r:parseFloat(pr.paddingRight)||0,b:parseFloat(pr.paddingBottom)||0,l:parseFloat(pr.paddingLeft)||0};
 const land=vw>vh*1.05;
 const ctrl=Math.round(clamp(Math.min(vw,vh)*.25,104,200));
 const pad=document.getElementById('pad'),bA=document.getElementById('bA'),bB=document.getElementById('bB'),bS=document.getElementById('bStart'),hint=document.getElementById('hint');
 let s,sw,sh,sx,sy,padC,btnC;
 if(land){const sideW=ctrl+Math.max(24,si.l,si.r)+24;const aw=vw-2*sideW,ah=vh-si.t-si.b-28;s=Math.min(aw/W,ah/H);sw=Math.floor(W*s);sh=Math.floor(H*s);sx=Math.floor((vw-sw)/2);sy=Math.floor(si.t+(vh-si.t-si.b-sh)/2);
  padC=[Math.max(16,si.l)+ctrl/2+8,vh*.58];btnC=[vw-Math.max(16,si.r)-ctrl/2-8,vh*.58];}
 else{const aw=vw-Math.max(16,si.l)-Math.max(16,si.r)-12,ah=vh*.56-si.t;s=Math.min(aw/W,ah/H);sw=Math.floor(W*s);sh=Math.floor(H*s);sx=Math.floor((vw-sw)/2);sy=Math.floor(si.t+Math.max(18,vh*.04));
  const cy=sy+sh+(vh-si.b-sy-sh)/2;padC=[Math.max(vw*.27,ctrl/2+20),cy];btnC=[Math.min(vw*.73,vw-ctrl/2-20),cy];}
 Object.assign(cv.style,{left:sx+'px',top:sy+'px',width:sw+'px',height:sh+'px'});
 const dpr=window.devicePixelRatio||1;const k=clamp(Math.ceil(s*dpr),2,8);if(k!==K)setupCanvas(k);
 Object.assign(pad.style,{width:ctrl+'px',height:ctrl+'px',left:(padC[0]-ctrl/2)+'px',top:(padC[1]-ctrl/2)+'px'});
 const bs=Math.round(ctrl*.44);
 Object.assign(bA.style,{width:bs+'px',height:bs+'px',left:(btnC[0]+ctrl*.04)+'px',top:(btnC[1]-ctrl*.42)+'px',fontSize:Math.round(bs*.32)+'px'});
 Object.assign(bB.style,{width:bs+'px',height:bs+'px',left:(btnC[0]-ctrl*.48)+'px',top:(btnC[1]-ctrl*.1)+'px',fontSize:Math.round(bs*.32)+'px'});
 const stW=Math.round(ctrl*.6);
 Object.assign(bS.style,{width:stW+'px',height:'28px',left:(btnC[0]-stW/2)+'px',top:(btnC[1]+ctrl*.48)+'px'});
 Object.assign(hint.style,{width:ctrl+40+'px',left:(padC[0]-ctrl/2-20)+'px',top:(padC[1]+ctrl/2+18)+'px'});
}
addEventListener('resize',layout);addEventListener('orientationchange',()=>setTimeout(layout,200));
layout();

let last=performance.now(),acc=0;
function loop(now){
 const dt=Math.min(100,now-last);last=now;acc+=dt;
 if(acc>=12){acc=Math.max(0,acc-16.667);
  fc++;pollInput();tickWaiters();
  if(mode==='world'&&!busy&&G)worldUpdate();
  if(P.bumpT>0)P.bumpT--;
  if(B)battleTick();
  render();
 }
 requestAnimationFrame(loop);
}
(document.fonts&&document.fonts.load?document.fonts.load('8px "Press Start 2P"').catch(()=>{}):Promise.resolve()).then(()=>{run(titleFlow);requestAnimationFrame(loop);});
</script>
